<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>으뜸체력왕 기록</title>
<!-- 홈 화면 바로가기: Apps Script 웹앱은 apple-touch-icon을 못 달아서(구글 바깥 페이지) 이 페이지가 아이콘을 들고 웹앱으로 넘겨 준다 -->
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="으뜸체력왕">
<meta name="theme-color" content="#1f2a6b">
<script>
  // 홈 화면에서 열었거나(웹 앱 모드) 주소에 go=1이 있으면 곧바로 기록 웹앱으로 넘어간다.
  // 그냥 열었을 때는 안내를 보여 주고 주소만 ?go=1로 바꿔 둔다 → 이 상태로 홈 화면에 추가하면 다음부터 바로 넘어간다.
  var APP = 'https://script.google.com/macros/s/AKfycbw24NzLjXK5jBoJ-iZbHWeEbuGANQx_B4boURJmBnQD39YKiQlQjnVPsKgBU_WPjF64/exec';
  var mq = function (m) { return window.matchMedia && window.matchMedia('(display-mode: ' + m + ')').matches; };
  var fromHome = navigator.standalone === true || mq('standalone') || mq('fullscreen') || mq('minimal-ui');
  if (fromHome || /[?&]go=1(&|$)/.test(location.search)) {
    document.documentElement.className = 'going';
    location.replace(APP);
  } else {
    try { history.replaceState(null, '', location.pathname + '?go=1'); } catch (e) {}
  }
</script>
<style>
  :root { --navy: #1f2a6b; --navy-2: #34449c; --gold: #f2c430; --ink: #262838; --ink-2: #5f6072; --line: #e6e1d8; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
    color: var(--ink); background: linear-gradient(160deg, var(--navy-2), var(--navy) 55%, #151b4d); display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  .card { width: 100%; max-width: 420px; background: #fff; border-radius: 22px; padding: 28px 22px 22px; text-align: center; box-shadow: 0 24px 50px -20px rgba(0,0,0,.55); }
  .card img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 8px 18px -8px rgba(31,42,107,.6); }
  h1 { margin-top: 14px; font-size: 24px; letter-spacing: -.5px; color: var(--navy); }
  .sub { margin-top: 4px; font-size: 14px; color: var(--ink-2); }
  .open { display: block; margin-top: 18px; padding: 15px; border-radius: 14px; background: var(--navy); color: #fff; font-size: 18px; font-weight: 700; text-decoration: none;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.25); }
  .how { margin-top: 20px; text-align: left; border-top: 1px solid var(--line); padding-top: 16px; }
  .how h2 { font-size: 15px; color: var(--navy); margin-bottom: 8px; }
  .how ol { padding-left: 20px; font-size: 14px; line-height: 1.6; color: var(--ink); }
  .how ol + h2 { margin-top: 12px; }
  .how b { color: var(--navy); }
  .note { margin-top: 14px; font-size: 12.5px; color: var(--ink-2); line-height: 1.5; }
  .going-msg { display: none; color: #fff; text-align: center; font-size: 17px; font-weight: 700; }
  .going-msg img { width: 88px; height: 88px; border-radius: 20px; margin-bottom: 14px; }
  .going-msg a { display: inline-block; margin-top: 12px; color: var(--gold); font-size: 14px; }
  html.going .card { display: none; }
  html.going .going-msg { display: block; }
</style>
</head>
<body>
<div class="going-msg">
  <img src="icon-192.png" alt=""><br>
  기록 웹앱을 여는 중…<br>
  <a id="goLink" href="#">열리지 않으면 여기를 누르세요</a>
</div>
<main class="card">
  <img src="icon-192.png" alt="으뜸체력왕 아이콘">
  <h1>으뜸체력왕 기록</h1>
  <p class="sub">화접중학교 2026 으뜸체력왕 선발대회</p>
  <a class="open" id="openLink" href="#">기록 웹앱 열기</a>
  <div class="how">
    <h2>아이폰 홈 화면에 추가</h2>
    <ol>
      <li><b>사파리</b>에서 이 페이지를 연 채로</li>
      <li>아래 <b>공유</b> 버튼(네모에 위쪽 화살표) 누르기</li>
      <li><b>홈 화면에 추가</b> → <b>추가</b></li>
    </ol>
    <h2>안드로이드 홈 화면에 추가</h2>
    <ol>
      <li><b>크롬</b>에서 이 페이지를 연 채로</li>
      <li>오른쪽 위 <b>⋮</b> 메뉴 → <b>홈 화면에 추가</b></li>
    </ol>
  </div>
  <p class="note">홈 화면 아이콘을 누르면 기록 웹앱이 바로 열립니다.<br>웹앱 화면에서 직접 추가하면 아이콘이 붙지 않으니 이 페이지에서 추가하세요.</p>
</main>
<script>
  document.getElementById('openLink').href = APP;
  document.getElementById('goLink').href = APP;
</script>
</body>
</html>
